// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        // 替换失效的 jcenter，使用阿里云和 Bintray 镜像源
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { 
            url 'https://jcenter.bintray.com'
            allowInsecureProtocol = true
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.1.1"
        classpath 'com.jakewharton:butterknife-gradle-plugin:10.1.0'//黄油刀

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        
        // 1. JitPack 仓库
        maven { url "https://jitpack.io" }
        
        // 2. 蒲公英 Pgyer 官方仓库（解决 com.pgyer:analytics 下载）
        maven { url "https://frontjs-static.pgyer.com/dist/sdk/pgyersdk" }
        maven { url "https://raw.githubusercontent.com/Pgyer/analytics/master" }

        // 3. 个推 Getui 仓库 (必须用 http 协议 + allowInsecureProtocol，避免 SSL 证书报错)
        maven { 
            url "http://mvn.gt.getui.com/nexus/content/repositories/releases/"
            allowInsecureProtocol = true
        }

        // 4. 阿里云镜像 & JCenter 镜像
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { 
            url 'https://jcenter.bintray.com'
            allowInsecureProtocol = true
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
