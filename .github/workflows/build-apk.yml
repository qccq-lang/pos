name: Build Android APK

on:
  push:
    branches: [ main, master ]  # 当有代码更新时触发
  workflow_dispatch:             # 允许在 GitHub 网页上手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出源码
      uses: actions/checkout@v4

    - name: 2. 配置 Java 环境 (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 赋予 gradlew 执行权限
      run: chmod +x gradlew

    - name: 4. 编译生成 APK (Debug 测试版)
      run: ./gradlew assembleDebug

    - name: 5. 上传生成的 APK 文件
      uses: actions/upload-artifact@v4
      with:
        name: android-pos-apk
        path: app/build/outputs/apk/debug/*.apk
